<!DOCTYPE html>
<html>
<head>
    <title>Complete Flow Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        [data-tab-content] { display: none; }
        [data-tab-content].active { display: block; }
        .tab-actual-content { padding: 20px; }
    </style>
</head>
<body>
    <h1>Complete Flow Test</h1>
    
    <!-- Tab Navigation -->
    <div class="tab-navigation" style="margin-bottom: 20px;">
        <button onclick="showTab('overview')" id="overview-tab">Overview</button>
        <button onclick="showTab('heatmap')" id="heatmap-tab">Heatmap</button>
        <button onclick="showTab('taxonomy')" id="taxonomy-tab">Taxonomy</button>
        <button onclick="showTab('evidence')" id="evidence-tab">Evidence</button>
        <button onclick="showTab('methodology')" id="methodology-tab">Methodology</button>
    </div>
    
    <!-- Overview Tab -->
    <div data-tab-content="overview" class="active">
        <div class="tab-actual-content">
            <div id="dashboardCards">
                <h3>Dashboard Cards Container</h3>
                <p>Loading...</p>
            </div>
            <div id="companiesContainer">
                <h3>Company Cards Container</h3>
                <p>Loading...</p>
            </div>
        </div>
    </div>
    
    <!-- Other tabs -->
    <div data-tab-content="heatmap">
        <div class="tab-actual-content">
            <h3>Heatmap Tab</h3>
        </div>
    </div>
    
    <div data-tab-content="taxonomy">
        <div class="tab-actual-content">
            <h3>Taxonomy Tab</h3>
        </div>
    </div>
    
    <div data-tab-content="evidence">
        <div class="tab-actual-content">
            <h3>Evidence Tab</h3>
        </div>
    </div>
    
    <div data-tab-content="methodology">
        <div class="tab-actual-content">
            <h3>Methodology Tab</h3>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Test Results</h2>
        <div id="test-results"></div>
        <button onclick="runCompleteTest()" style="margin: 10px 0; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Run Complete Test</button>
    </div>
    
    <!-- Load the scripts -->
    <script src="bigdata_risk_analyzer/static/scripts/dashboard_cards.js"></script>
    <script src="bigdata_risk_analyzer/static/scripts/company_cards.js"></script>
    <script src="bigdata_risk_analyzer/static/scripts/report_renderer.js"></script>
    
    <script>
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('[data-tab-content]').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            const selectedTab = document.querySelector(`[data-tab-content="${tabName}"]`);
            if (selectedTab) {
                selectedTab.classList.add('active');
            }
        }
        
        function runCompleteTest() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<p class="info">🔄 Running complete test...</p>';
            
            // Test 1: Check function availability
            const functionTests = [
                { name: 'renderDashboardCards', func: window.renderDashboardCards },
                { name: 'renderCompanyCards', func: window.renderCompanyCards },
                { name: 'renderScreenerReport', func: window.renderScreenerReport }
            ];
            
            let html = '<h3>Test Results:</h3>';
            html += '<h4>1. Function Availability:</h4><ul>';
            let allFunctionsAvailable = true;
            functionTests.forEach(test => {
                const status = test.func ? '✅ Available' : '❌ Missing';
                const className = test.func ? 'success' : 'error';
                html += `<li class="${className}">${test.name}: ${status}</li>`;
                if (!test.func) allFunctionsAvailable = false;
            });
            html += '</ul>';
            
            if (!allFunctionsAvailable) {
                resultsDiv.innerHTML = html;
                return;
            }
            
            // Test 2: Load demo data
            html += '<h4>2. Demo Data Loading:</h4>';
            fetch('bigdata_risk_analyzer/static/data/import_tariffs.json')
                .then(res => {
                    html += `<p class="info">📡 Fetch response: ${res.status}</p>`;
                    return res.json();
                })
                .then(data => {
                    html += `<p class="success">✅ Demo data loaded successfully</p>`;
                    html += `<p class="info">📊 Data keys: ${Object.keys(data).join(', ')}</p>`;
                    html += `<p class="info">🏢 Companies: ${data.risk_scoring ? Object.keys(data.risk_scoring).length : 0}</p>`;
                    
                    // Test 3: Test renderScreenerReport
                    html += '<h4>3. Report Rendering:</h4>';
                    try {
                        window.renderScreenerReport(data);
                        html += `<p class="success">✅ renderScreenerReport called successfully</p>`;
                        
                        // Test 4: Check if content was rendered
                        setTimeout(() => {
                            html += '<h4>4. Content Verification:</h4>';
                            
                            const dashboardContainer = document.getElementById('dashboardCards');
                            const companyContainer = document.getElementById('companiesContainer');
                            
                            const dashboardHasContent = dashboardContainer && dashboardContainer.innerHTML.trim().length > 100;
                            const companyHasContent = companyContainer && companyContainer.innerHTML.trim().length > 100;
                            
                            html += `<p class="${dashboardHasContent ? 'success' : 'error'}">Dashboard Cards: ${dashboardHasContent ? '✅ Rendered' : '❌ Empty'}</p>`;
                            html += `<p class="${companyHasContent ? 'success' : 'error'}">Company Cards: ${companyHasContent ? '✅ Rendered' : '❌ Empty'}</p>`;
                            
                            if (dashboardHasContent && companyHasContent) {
                                html += '<p class="success">🎉 All tests passed! Dashboard and company cards are rendering correctly.</p>';
                            } else {
                                html += '<p class="error">❌ Some content failed to render. Check console for errors.</p>';
                            }
                            
                            resultsDiv.innerHTML = html;
                        }, 1000);
                        
                    } catch (err) {
                        html += `<p class="error">❌ renderScreenerReport error: ${err.message}</p>`;
                        resultsDiv.innerHTML = html;
                    }
                })
                .catch(err => {
                    html += `<p class="error">❌ Failed to load demo data: ${err.message}</p>`;
                    resultsDiv.innerHTML = html;
                });
        }
        
        // Run test when page loads
        window.addEventListener('load', () => {
            console.log('Test page loaded');
        });
    </script>
</body>
</html>
