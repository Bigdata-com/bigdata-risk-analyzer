[project]
name = "bigdata_risk_analyzer"
version = "2.3.7"
description = "Identify corportate exposure to uncertain scenarios and risk channels, grounded on thousands of sources provided by Bigdata.com"
authors = [{name = "jaldana", email = "jaldana@ravenpack.com"}]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.2.1",
    "jinja2==3.1.6",
    "structlog>=25.4.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "bigdata-client==2.19.0",
    # Bigdata research tools is working on a v1.0.0 version that is on beta, while we wait for its release we pin to a commit 
    # including the required features https://github.com/Bigdata-com/bigdata-research-tools/tree/preparation_for_v1
    "bigdata-research-tools[openai] @ git+https://github.com/Bigdata-com/bigdata-research-tools@4d1bb23e0dae25f10e0afc537532da5cab2f7359",
    "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bigdata_risk_analyzer"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
