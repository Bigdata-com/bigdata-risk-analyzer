[project]
name = "bigdata_risk_analyzer"
version = "3.0.0"
description = "Identify corportate exposure to uncertain scenarios and risk channels, grounded on thousands of sources provided by Bigdata.com"
authors = [{name = "jaldana", email = "jaldana@ravenpack.com"}]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.2.1",
    "jinja2==3.1.6",
    "structlog>=25.4.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "sqlmodel>=0.0.24",
    "bigdata-smart-batching>=1.4.1,<2.0.0",
    "openai>=2.0.0,<3.0.0",
    "requests>=2.31",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bigdata_risk_analyzer"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
