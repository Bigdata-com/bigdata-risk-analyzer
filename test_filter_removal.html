<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Removal Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white p-8">
    <h1 class="text-2xl font-bold mb-6">Filter Removal Test</h1>
    
    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-3">Test Filter Chips</h2>
        <div id="filter-chips" class="flex flex-wrap gap-2 min-h-[40px] p-3 bg-zinc-800/30 rounded-lg">
            <div class="text-sm text-zinc-500 italic">No filters applied</div>
        </div>
    </div>
    
    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-3">Test Controls</h2>
        <div class="space-y-4">
            <button onclick="addTestFilters()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 rounded-lg">
                Add Test Filters
            </button>
            <button onclick="clearAllFilters()" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg">
                Clear All Filters
            </button>
        </div>
    </div>
    
    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-3">Filter State</h2>
        <pre id="filter-state" class="bg-zinc-800 p-4 rounded-lg text-sm overflow-auto"></pre>
    </div>

    <script>
        // Mock filter state
        let filterState = {
            search: '',
            sectors: [],
            industries: [],
            risks: [],
            topN: ''
        };

        // Mock escapeHtml function
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add test filters
        function addTestFilters() {
            filterState.search = 'Apple';
            filterState.sectors = ['Technology', 'Healthcare'];
            filterState.industries = ['Software', 'Biotechnology'];
            filterState.risks = ['AI Risk', 'Regulatory Risk'];
            filterState.topN = '20';
            
            updateFilterChips();
            updateFilterStateDisplay();
        }

        // Update filter chips display
        function updateFilterChips() {
            const chipsContainer = document.getElementById('filter-chips');
            if (!chipsContainer) return;
            
            const chips = [];
            
            // Search chip
            if (filterState.search) {
                chips.push(`
                    <div class="filter-chip bg-green-500/20 border border-green-500/30 text-green-300 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                        <span>Search: "${escapeHtml(filterState.search)}"</span>
                        <button onclick="removeFilter('search', '${filterState.search.replace(/'/g, "\\'").replace(/"/g, '\\"')}')" class="hover:text-green-100">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);
            }
            
            // Sector chips
            filterState.sectors.forEach(sector => {
                chips.push(`
                    <div class="filter-chip bg-blue-500/20 border border-blue-500/30 text-blue-300 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                        <span>Sector: ${escapeHtml(sector)}</span>
                        <button onclick="removeFilter('sector', '${sector.replace(/'/g, "\\'").replace(/"/g, '\\"')}')" class="hover:text-blue-100">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);
            });
            
            // Industry chips
            filterState.industries.forEach(industry => {
                chips.push(`
                    <div class="filter-chip bg-purple-500/20 border border-purple-500/30 text-purple-300 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                        <span>Industry: ${escapeHtml(industry)}</span>
                        <button onclick="removeFilter('industry', '${industry.replace(/'/g, "\\'").replace(/"/g, '\\"')}')" class="hover:text-purple-100">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);
            });
            
            // Risk chips
            filterState.risks.forEach(risk => {
                chips.push(`
                    <div class="filter-chip bg-red-500/20 border border-red-500/30 text-red-300 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                        <span>Risk: ${escapeHtml(risk)}</span>
                        <button onclick="removeFilter('risk', '${risk.replace(/'/g, "\\'").replace(/"/g, '\\"')}')" class="hover:text-red-100">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);
            });
            
            // Top N chip
            if (filterState.topN) {
                chips.push(`
                    <div class="filter-chip bg-orange-500/20 border border-orange-500/30 text-orange-300 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                        <span>Top ${filterState.topN}</span>
                        <button onclick="removeFilter('topN', '${filterState.topN.replace(/'/g, "\\'").replace(/"/g, '\\"')}')" class="hover:text-orange-100">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);
            }
            
            if (chips.length === 0) {
                chipsContainer.innerHTML = '<div class="text-sm text-zinc-500 italic">No filters applied</div>';
            } else {
                chipsContainer.innerHTML = chips.join('');
            }
        }

        // Remove individual filter
        function removeFilter(type, value) {
            console.log(`Removing filter: ${type} = ${value}`);
            
            if (type === 'search') {
                filterState.search = '';
            } else if (type === 'topN') {
                filterState.topN = '';
            } else {
                filterState[type] = filterState[type].filter(item => item !== value);
            }
            
            updateFilterChips();
            updateFilterStateDisplay();
        }

        // Clear all filters
        function clearAllFilters() {
            filterState.search = '';
            filterState.sectors = [];
            filterState.industries = [];
            filterState.risks = [];
            filterState.topN = '';
            
            updateFilterChips();
            updateFilterStateDisplay();
        }

        // Update filter state display
        function updateFilterStateDisplay() {
            const stateDisplay = document.getElementById('filter-state');
            stateDisplay.textContent = JSON.stringify(filterState, null, 2);
        }

        // Initialize
        updateFilterStateDisplay();
    </script>
</body>
</html>
