
<!DOCTYPE html>
<html>
<head>
    <title>Advanced Deselection Test</title>
    <style>
        .filter-chip { margin: 2px; padding: 4px 8px; border-radius: 12px; display: inline-flex; align-items: center; gap: 4px; }
        .bg-blue-500/20 { background-color: rgba(59, 130, 246, 0.2); }
        .border-blue-500/30 { border: 1px solid rgba(59, 130, 246, 0.3); }
        .text-blue-300 { color: rgb(147, 197, 253); }
        .text-zinc-500 { color: rgb(113, 113, 122); }
        .text-zinc-300 { color: rgb(212, 212, 216); }
    </style>
</head>
<body>
    <h1>Advanced Deselection Test</h1>
    
    <div id="filter-chips" class="flex flex-wrap gap-2 min-h-[40px] p-3 bg-zinc-800/30 rounded-lg">
        <div class="text-sm text-zinc-500 italic">No filters applied</div>
    </div>
    
    <div class="w-80 bg-zinc-800/50 rounded-lg p-4 h-fit">
        <h3 class="text-lg font-semibold text-white mb-4">Filter Companies</h3>
        
        <!-- Sector Filter -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-zinc-300 mb-2">Sector</label>
            <div class="space-y-2 max-h-32 overflow-y-auto">
                <label class="flex items-center space-x-2 cursor-pointer hover:bg-zinc-700/50 p-1 rounded">
                    <input type="checkbox" class="sector-filter" value="Technology" onchange="handleFilterChange()">
                    <span class="text-sm text-zinc-300">Technology</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer hover:bg-zinc-700/50 p-1 rounded">
                    <input type="checkbox" class="sector-filter" value="Healthcare" onchange="handleFilterChange()">
                    <span class="text-sm text-zinc-300">Healthcare</span>
                </label>
            </div>
        </div>
    </div>
    
    <div id="test-results"></div>
    
    <script>
        // Exact copy of the filter state and functions from the real code
        let filterState = {
            search: '',
            sectors: [],
            industries: [],
            risks: [],
            topN: ''
        };
        
        let currentScreenerData = {
            companies: [
                ['Apple Inc', { sector: 'Technology', industry: 'Software' }],
                ['Microsoft Corp', { sector: 'Technology', industry: 'Software' }],
                ['Johnson & Johnson', { sector: 'Healthcare', industry: 'Pharmaceuticals' }]
            ]
        };
        
        function updateFilterChips() {
            const chipsContainer = document.getElementById('filter-chips');
            if (!chipsContainer) return;
            
            const chips = [];
            
            // Sector chips
            (filterState.sectors || []).forEach(sector => {
                const escapedSector = sector.replace(/'/g, "\'").replace(/"/g, '\"');
                chips.push(`
                    <div class="filter-chip bg-blue-500/20 border border-blue-500/30 text-blue-300 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                        <span>Sector: ${sector}</span>
                        <button onclick="removeFilter('sector', '${escapedSector}')" class="hover:text-blue-100">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);
            });
            
            if (chips.length === 0) {
                chipsContainer.innerHTML = '<div class="text-sm text-zinc-500 italic">No filters applied</div>';
            } else {
                chipsContainer.innerHTML = chips.join('');
            }
        }
        
        function filterScreener() {
            if (!currentScreenerData) return;
            
            const searchTerm = filterState.search.toLowerCase();
            const selectedSectors = filterState.sectors;
            const selectedIndustries = filterState.industries;
            const selectedRisks = filterState.risks;
            const topN = filterState.topN;
            
            let filteredCompanies = currentScreenerData.companies.filter(([companyName, scoring]) => {
                if (searchTerm && !companyName.toLowerCase().includes(searchTerm)) {
                    return false;
                }
                if (selectedSectors.length > 0 && !selectedSectors.includes(scoring.sector)) {
                    return false;
                }
                if (selectedIndustries.length > 0 && !selectedIndustries.includes(scoring.industry)) {
                    return false;
                }
                return true;
            });
            
            if (topN && topN !== '') {
                filteredCompanies = filteredCompanies.slice(0, parseInt(topN));
            }
            
            document.getElementById('screenerCount').textContent = 
                `Showing ${filteredCompanies.length} of ${currentScreenerData.companies.length} companies`;
        }
        
        function removeFilter(type, value) {
            console.log(`removeFilter called with type: ${type}, value: ${value}`);
            
            if (type === 'search') {
                filterState.search = '';
                const searchInput = document.getElementById('searchCompany');
                if (searchInput) searchInput.value = '';
            } else if (type === 'topN') {
                filterState.topN = '';
                const topNSelect = document.getElementById('filterTopN');
                if (topNSelect) topNSelect.value = '';
            } else {
                // Ensure the filter array exists before calling filter
                if (!filterState[type]) {
                    filterState[type] = [];
                }
                
                console.log(`Before removal - ${type}:`, filterState[type]);
                filterState[type] = filterState[type].filter(item => item !== value);
                console.log(`After removal - ${type}:`, filterState[type]);
                
                // Uncheck the corresponding checkbox - try both escaped and unescaped values
                const escapedValue = value.replace(/\'/g, "'").replace(/\"/g, '"');
                let checkbox = document.querySelector(`.${type}-filter[value="${escapedValue}"]`);
                
                // If not found with escaped value, try with original value
                if (!checkbox) {
                    checkbox = document.querySelector(`.${type}-filter[value="${value}"]`);
                }
                
                if (checkbox) {
                    console.log(`Found checkbox for ${type}: ${value}, unchecking it`);
                    checkbox.checked = false;
                } else {
                    console.log(`Checkbox not found for ${type}: ${value}, trying fallback`);
                    // Fallback: find by iterating through all checkboxes
                    const allCheckboxes = document.querySelectorAll(`.${type}-filter`);
                    for (const cb of allCheckboxes) {
                        if (cb.value === value || cb.value === escapedValue) {
                            console.log(`Found checkbox via fallback, unchecking it`);
                            cb.checked = false;
                            break;
                        }
                    }
                }
            }
            
            updateFilterChips();
            filterScreener();
        }
        
        // The EXACT handleFilterChange function from the real code
        function handleFilterChange() {
            console.log('handleFilterChange called');
            
            // Small delay to ensure DOM has updated
            setTimeout(() => {
                console.log('handleFilterChange timeout executing');
                
                // Update filter state - use a more reliable method
                const allSectorCheckboxes = document.querySelectorAll('.sector-filter');
                const allIndustryCheckboxes = document.querySelectorAll('.industry-filter');
                const allRiskCheckboxes = document.querySelectorAll('.risk-filter');
                const topNSelect = document.getElementById('filterTopN');
            
                // Get only the checked ones
                const newSectors = Array.from(allSectorCheckboxes)
                    .filter(cb => cb.checked)
                    .map(cb => cb.value);
                const newIndustries = Array.from(allIndustryCheckboxes)
                    .filter(cb => cb.checked)
                    .map(cb => cb.value);
                const newRisks = Array.from(allRiskCheckboxes)
                    .filter(cb => cb.checked)
                    .map(cb => cb.value);
                const newTopN = topNSelect ? topNSelect.value : '';
                
                console.log('New filter values:', {
                    sectors: newSectors,
                    industries: newIndustries,
                    risks: newRisks,
                    topN: newTopN
                });
                
                filterState.sectors = newSectors;
                filterState.industries = newIndustries;
                filterState.risks = newRisks;
                filterState.topN = newTopN;
                
                console.log('Updated filterState:', filterState);
                
                updateFilterChips();
                filterScreener();
            }, 10); // Small delay to ensure DOM has updated
        }
        
        // Advanced test function
        function runAdvancedDeselectionTest() {
            console.log('🧪 Starting Advanced Deselection Test...');
            
            const resultsDiv = document.getElementById('test-results');
            let testResults = [];
            
            // Test 1: Check a sector filter
            console.log('\n=== Test 1: Check Technology sector ===');
            const techCheckbox = document.querySelector('.sector-filter[value="Technology"]');
            techCheckbox.checked = true;
            techCheckbox.dispatchEvent(new Event('change'));
            
            setTimeout(() => {
                const test1Result = {
                    step: 'After checking Technology',
                    filterState: JSON.parse(JSON.stringify(filterState)),
                    chipsHTML: document.getElementById('filter-chips').innerHTML,
                    checkboxChecked: techCheckbox.checked,
                    hasChips: !document.getElementById('filter-chips').innerHTML.includes('No filters applied')
                };
                testResults.push(test1Result);
                console.log('Test 1 Result:', test1Result);
                
                // Test 2: Uncheck the same filter
                console.log('\n=== Test 2: Uncheck Technology sector ===');
                techCheckbox.checked = false;
                techCheckbox.dispatchEvent(new Event('change'));
                
                setTimeout(() => {
                    const test2Result = {
                        step: 'After unchecking Technology',
                        filterState: JSON.parse(JSON.stringify(filterState)),
                        chipsHTML: document.getElementById('filter-chips').innerHTML,
                        checkboxChecked: techCheckbox.checked,
                        hasChips: !document.getElementById('filter-chips').innerHTML.includes('No filters applied')
                    };
                    testResults.push(test2Result);
                    console.log('Test 2 Result:', test2Result);
                    
                    // Test 3: Check via chip removal
                    console.log('\n=== Test 3: Check Technology again, then remove via chip ===');
                    techCheckbox.checked = true;
                    techCheckbox.dispatchEvent(new Event('change'));
                    
                    setTimeout(() => {
                        // Now try to remove via chip
                        const chipButton = document.querySelector('button[onclick*="removeFilter"]');
                        if (chipButton) {
                            console.log('Found chip button, clicking it...');
                            chipButton.click();
                            
                            setTimeout(() => {
                                const test3Result = {
                                    step: 'After removing via chip',
                                    filterState: JSON.parse(JSON.stringify(filterState)),
                                    chipsHTML: document.getElementById('filter-chips').innerHTML,
                                    checkboxChecked: techCheckbox.checked,
                                    hasChips: !document.getElementById('filter-chips').innerHTML.includes('No filters applied')
                                };
                                testResults.push(test3Result);
                                console.log('Test 3 Result:', test3Result);
                                
                                // Final analysis
                                console.log('\n=== FINAL ANALYSIS ===');
                                const finalAnalysis = {
                                    test1Passed: test1Result.hasChips && test1Result.filterState.sectors.length === 1,
                                    test2Passed: !test2Result.hasChips && test2Result.filterState.sectors.length === 0,
                                    test3Passed: !test3Result.hasChips && test3Result.filterState.sectors.length === 0,
                                    overallSuccess: false
                                };
                                
                                finalAnalysis.overallSuccess = finalAnalysis.test1Passed && finalAnalysis.test2Passed && finalAnalysis.test3Passed;
                                
                                console.log('Final Analysis:', finalAnalysis);
                                
                                // Display results
                                resultsDiv.innerHTML = `
                                    <h2>Test Results</h2>
                                    <div style="background: ${finalAnalysis.overallSuccess ? '#d4edda' : '#f8d7da'}; padding: 10px; border-radius: 5px; margin: 10px 0;">
                                        <strong>Overall Result: ${finalAnalysis.overallSuccess ? '✅ PASSED' : '❌ FAILED'}</strong>
                                    </div>
                                    <h3>Individual Tests:</h3>
                                    <ul>
                                        <li>Test 1 (Check): ${finalAnalysis.test1Passed ? '✅ PASSED' : '❌ FAILED'}</li>
                                        <li>Test 2 (Uncheck): ${finalAnalysis.test2Passed ? '✅ PASSED' : '❌ FAILED'}</li>
                                        <li>Test 3 (Chip removal): ${finalAnalysis.test3Passed ? '✅ PASSED' : '❌ FAILED'}</li>
                                    </ul>
                                    <h3>Detailed Results:</h3>
                                    <pre>${JSON.stringify(testResults, null, 2)}</pre>
                                `;
                                
                                if (finalAnalysis.overallSuccess) {
                                    console.log('🎉 ALL TESTS PASSED! Deselection is working correctly!');
                                } else {
                                    console.log('❌ SOME TESTS FAILED! Deselection has issues.');
                                }
                            }, 100);
                        } else {
                            console.log('No chip button found for test 3');
                        }
                    }, 100);
                }, 100);
            }, 100);
        }
        
        // Run test when page loads
        window.addEventListener('load', () => {
            setTimeout(runAdvancedDeselectionTest, 200);
        });
    </script>
</body>
</html>
