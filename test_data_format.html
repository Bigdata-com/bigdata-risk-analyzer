<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Format Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-8">
    <h1 class="text-2xl font-bold mb-4">Data Format Test</h1>
    <div id="testResults" class="space-y-4"></div>

    <script>
        // Test data adapter function
        function adaptRiskDataToThemeFormat(riskData) {
            // Validate input data
            if (!riskData || typeof riskData !== 'object') {
                console.error('Invalid risk data provided to adapter:', riskData);
                return {
                    theme_scoring: {},
                    theme_taxonomy: {},
                    content: []
                };
            }
            
            // If data is already in theme format, return as-is
            if (riskData.theme_scoring && typeof riskData.theme_scoring === 'object') {
                return riskData;
            }
            
            // Convert risk_scoring to theme_scoring
            const adapted = {
                theme_scoring: {},
                theme_taxonomy: riskData.risk_taxonomy || {},
                content: riskData.content || []
            };
            
            // Transform each company's risk data to theme format
            if (riskData.risk_scoring && typeof riskData.risk_scoring === 'object') {
                try {
                    for (const [companyName, companyData] of Object.entries(riskData.risk_scoring)) {
                        if (companyData && typeof companyData === 'object') {
                            adapted.theme_scoring[companyName] = {
                                ...companyData,
                                themes: companyData.risks || companyData.themes || {}
                            };
                        }
                    }
                } catch (error) {
                    console.error('Error adapting risk data:', error);
                }
            }
            
            return adapted;
        }

        // Test dashboard cards function
        function renderDashboardCards(data) {
            const container = document.getElementById('testResults');
            if (!container || !data) return;

            // Calculate stats
            const companies = Object.entries(data.theme_scoring || {});
            const totalCompanies = companies.length;
            
            // Ensure companies is an array
            if (!Array.isArray(companies)) {
                console.error('Companies data is not an array:', companies);
                container.innerHTML = '<p class="text-red-400">Error: Invalid data format</p>';
                return;
            }
            
            // Calculate companies exposed safely
            const companiesExposed = companies.filter ? 
                companies.filter(([_, scoring]) => (scoring.composite_score || 0) > 0).length : 0;
            
            container.innerHTML = `
                <div class="bg-zinc-800 p-4 rounded">
                    <h2 class="text-lg font-semibold mb-2">Test Results</h2>
                    <p>Total Companies: ${totalCompanies}</p>
                    <p>Companies Exposed: ${companiesExposed}</p>
                    <p>Data Type: ${typeof data.theme_scoring}</p>
                    <p>Companies Array: ${Array.isArray(companies)}</p>
                </div>
            `;
        }

        // Test cases
        const testCases = [
            {
                name: "Normal Data",
                data: {
                    theme_scoring: {
                        "Company A": { composite_score: 0.5, coverage_score: 0.3, intensity_score: 0.7 },
                        "Company B": { composite_score: 0.8, coverage_score: 0.6, intensity_score: 0.9 }
                    }
                }
            },
            {
                name: "Empty Data",
                data: {
                    theme_scoring: {}
                }
            },
            {
                name: "Null Data",
                data: null
            },
            {
                name: "Undefined Data",
                data: undefined
            },
            {
                name: "Invalid Data Type",
                data: "not an object"
            },
            {
                name: "Missing theme_scoring",
                data: {
                    risk_scoring: {
                        "Company A": { composite_score: 0.5 }
                    }
                }
            }
        ];

        // Run tests
        testCases.forEach((testCase, index) => {
            const testDiv = document.createElement('div');
            testDiv.className = 'mb-4 p-4 border border-zinc-700 rounded';
            testDiv.innerHTML = `<h3 class="font-semibold mb-2">Test ${index + 1}: ${testCase.name}</h3>`;
            
            const resultsDiv = document.createElement('div');
            testDiv.appendChild(resultsDiv);
            document.getElementById('testResults').appendChild(testDiv);
            
            try {
                const adaptedData = adaptRiskDataToThemeFormat(testCase.data);
                renderDashboardCards(adaptedData);
            } catch (error) {
                resultsDiv.innerHTML = `<p class="text-red-400">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
